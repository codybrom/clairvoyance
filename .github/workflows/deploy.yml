name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - skills/**
      - docs/src/**
      - docs/public/**
      - docs/package.json
      - docs/package-lock.json
      - docs/astro.config.mjs
      - docs/tsconfig.json
      - docs/edge/**
      - docs/test/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: skill pages and the sitemap read each file's last
          # commit date, which a shallow clone reports as HEAD for every file.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - run: npm test
        working-directory: docs
      # Same steps as actions/upload-pages-artifact@v4, minus its
      # --exclude=".[^/]*", which would drop dist/.well-known/.
      - name: Archive site
        run: |
          tar --dereference --hard-dereference --directory docs/dist \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
